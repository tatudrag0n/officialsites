name: Validate Mifron Pages

on:
  pull_request:
    paths:
      - 'mifron/**'
      - 'tatudragon/**'
      - 'src/**'
      - '404.html'
      - 'assets/**'
      - '_headers'
      - 'sitemap.xml'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'mifron/**'
      - 'tatudragon/**'
      - 'src/**'
      - '404.html'
      - 'assets/**'
      - '_headers'
      - 'sitemap.xml'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: mifron-pages-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate static release invariants
        shell: bash
        run: |
          set -euo pipefail
          test -s 404.html
          test -s assets/404.css
          test -s mifron/404.html
          test -s mifron/assets/404.css
          test -s mifron/index.html
          test -s mifron/_headers
          test -s mifron/robots.txt
          test -s mifron/sitemap.xml
          grep -q 'id="support"' mifron/index.html
          grep -q 'rel="canonical"' mifron/index.html
          grep -qi 'content-security-policy' mifron/_headers
          grep -qi 'strict-transport-security' mifron/_headers
          test -s tatudragon/index.html
          test -s tatudragon/404.html
          test -s tatudragon/_headers
          test -s tatudragon/robots.txt
          test -s tatudragon/sitemap.xml
          test -s tatudragon/assets/styles.css
          grep -q 'rel="canonical"' tatudragon/index.html
          grep -qi 'content-security-policy' tatudragon/_headers
          grep -qi 'strict-transport-security' tatudragon/_headers
          # Every external channel link must be a plain anchor, never a src/action.
          if grep -nE 'style=' tatudragon/index.html tatudragon/404.html; then
            echo 'Inline style found in the CSP-protected tatudragon page.' >&2
            exit 1
          fi
          if grep -nE '(src|action)="https?://' tatudragon/index.html; then
            echo 'External asset or form action found on the tatudragon page.' >&2
            exit 1
          fi
          if grep -nE 'style=' 404.html mifron/404.html; then
            echo 'Inline style found in the CSP-protected 404 page.' >&2
            exit 1
          fi
          if grep -RInE '(OPENAI_API_KEY|CLOUDFLARE_API_TOKEN|DISCORD_WEBHOOK_URL|SUPPORT_WEBHOOK_SECRET|BEGIN (RSA |OPENSSH )?PRIVATE KEY)' 404.html assets mifron tatudragon; then
            echo 'A secret-like value or secret variable name was found in the public site.' >&2
            exit 1
          fi
          # Allow only the Discord server widget as an explicitly reviewed external iframe.
          # All other absolute src/action URLs remain blocked by this invariant.
          if grep -nE '(src|action)="https?://' mifron/index.html | grep -vE 'src="https://discord\.com/widget\?'; then
            echo 'Unapproved external asset or form action found; review CSP and privacy impact before merging.' >&2
            exit 1
          fi
