name: Deploy ForgeCodex iPad Cloud

on:
  push:
    branches: [main]
    paths:
      - 'forgecodex/**'
      - '.github/workflows/deploy-forgecodex.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forgecodex-ipad-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Unpack ForgeCodex
        run: |
          cd forgecodex
          base64 -d bundle.tgz.b64 | tar -xz
          node --check src/worker.js
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd forgecodex
          npx --yes wrangler@4.127.0 deploy
