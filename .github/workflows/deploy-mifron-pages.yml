name: Deploy Mifron Pages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_MIFRON to publish the Mifron site'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mifron-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY_MIFRON' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MIFRON_PAGES_PROJECT: ${{ vars.MIFRON_PAGES_PROJECT }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$MIFRON_PAGES_PROJECT" || { echo 'Missing MIFRON_PAGES_PROJECT'; exit 1; }
          test "$MIFRON_PAGES_PROJECT" = 'mifron' || { echo 'MIFRON_PAGES_PROJECT must be the allowlisted project name: mifron'; exit 1; }
          test -f mifron/index.html

      - name: Deploy standalone Mifron site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MIFRON_PAGES_PROJECT: ${{ vars.MIFRON_PAGES_PROJECT }}
        run: npx --yes wrangler@4.127.0 pages deploy ./mifron --project-name "$MIFRON_PAGES_PROJECT"

      - name: Verify custom domain deployment
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          headers_file="$(mktemp)"
          trap 'rm -f "$body_file" "$headers_file"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 6 \
            --retry-all-errors https://mifron.mct-official.com/ -o "$body_file"
          curl --fail --silent --show-error --retry 10 --retry-delay 6 \
            --retry-all-errors --head https://mifron.mct-official.com/ -D "$headers_file" -o /dev/null
          grep -q 'id="support"' "$body_file"
          grep -qi '^content-security-policy:' "$headers_file"
          grep -qi '^strict-transport-security:' "$headers_file"
