name: Deploy officialsites Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: officialsites-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -f wrangler.toml
          test -f src/index.js
          test -f mifron/index.html
          test -f tatudragon/index.html

      - name: Validate Worker configuration
        run: npx --yes wrangler@4.127.0 deploy --dry-run

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.127.0 deploy

      - name: Verify production hosts
        run: |
          set -euo pipefail
          for host in mifron.mct-official.com crewmate.mct-official.com texroot.mct-official.com tatudragon.mct-official.com; do
            echo "Checking https://$host/"
            curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "https://$host/" -o "/tmp/$host.html"
            test -s "/tmp/$host.html"
          done
