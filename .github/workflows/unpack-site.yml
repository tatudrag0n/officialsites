name: Unpack website ZIP

on:
  push:
    branches: [main]
    paths:
      - MCTsites.zip

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove previously extracted website files
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'MCTsites.zip' \
            -exec rm -rf {} +

      - name: Extract website to repository root
        shell: bash
        run: unzip -o MCTsites.zip -d .

      - name: Commit extracted website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted file changes."
          else
            git commit -m "Deploy website from MCTsites.zip [skip ci]"
            git push
          fi
