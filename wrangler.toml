name = "officialsites-unified"
main = "src/index.js"
compatibility_date = "2026-09-11"

# Static files for the unified official site.
# The Worker rewrites each custom hostname to its site directory.
[assets]
directory = "."
binding = "ASSETS"

# Routes/domains are intentionally managed in the Cloudflare dashboard.
# This prevents Wrangler from overwriting the Custom Domains configured there.

[[kv_namespaces]]
binding = "QUESTS"
id = "d4ef57e2bf1e49ecb903748d1064c365"

[[kv_namespaces]]
binding = "PROPOSALS"
id = "6669782f077c4c699aad3eff402cc8da"
