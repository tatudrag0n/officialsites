name = "officialsites"
main = "src/index.js"
compatibility_date = "2026-09-11"

# Static files for the unified official site.
# The Worker rewrites each custom hostname to its site directory.
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

# Routes/domains are intentionally managed in the Cloudflare dashboard.
# This prevents Wrangler from overwriting the Custom Domains configured there.

[[kv_namespaces]]
binding = "QUESTS"
id = "d4ef57e2bf1e49ecb903748d1064c365"

[[kv_namespaces]]
binding = "PROPOSALS"
id = "6669782f077c4c699aad3eff402cc8da"

# Email Sending binding used to notify mifron@mct-official.com when a
# proposal or quest proposal is submitted. The sending domain
# (mct-official.com) must be onboarded to Email Sending first:
#   npx wrangler email sending enable mct-official.com
[[send_email]]
name = "EMAIL"
