name = "mifron-site"
main = "functions/api/_middleware.js"
compatibility_date = "2024-01-01"

# KV Namespace bindings
[[kv_namespaces]]
binding = "QUESTS"
id = "YOUR_QUESTS_NAMESPACE_ID"

[[kv_namespaces]]
binding = "PROPOSALS"
id = "YOUR_PROPOSALS_NAMESPACE_ID"

# Pages configuration
[pages]
build_command = "echo 'No build needed for static site'"
