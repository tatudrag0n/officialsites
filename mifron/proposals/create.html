<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fffef7">
  <title>提案作成 | Mifron</title>
  <meta name="description" content="Mifronに新しい提案を作成。テンプレートを選ぶだけで、機能提案・バグ報告・イベント企画をかんたんに入力できます。">
  <link rel="icon" href="../assets/mifron-favicon.png">
  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="stylesheet" href="../assets/proposals.css">
  <script src="../assets/config.js" defer></script>
  <script src="../assets/site.js" defer></script>
  <script src="../assets/proposals.js" defer></script>
</head>
<body class="proposal-page">
  <a class="skip" href="#main">本文へ移動</a>
  <header class="site-header sub-header">
    <div class="shell nav">
      <a class="brand" href="../">
        <img class="brand-icon" src="../assets/mifron-icon.webp" alt="Mifron">
        <span class="brand-text">Mifron</span>
      </a>
      <nav class="nav-links" aria-label="メインサイトナビゲーション">
        <a href="../">ホーム</a>
        <a href="../tutorial.html">チュートリアル</a>
        <a href="../quests/">クエスト</a>
        <a href="./">提案</a>
        <a href="../#join" class="discord">Discord</a>
      </nav>
      <button class="menu" aria-label="メニュー" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main id="main">
    <section class="sub-hero">
      <div class="shell reveal">
        <span class="kicker">Mifron Proposal System</span>
        <h1>提案を作成</h1>
        <p class="lead">テンプレートを選ぶと入力欄が自動で埋まります。あなたのアイデアでMifronをより良くしよう。</p>
      </div>
    </section>

    <section class="section">
      <div class="shell">
        <div class="proposal-form-panel reveal">
          <h2>テンプレートからかんたん作成</h2>
          <p class="panel-intro">近いテンプレートを選ぶと、項目の構成が自動で入ります。あとは内容を調整して送信するだけです。</p>
          <div class="proposal-template-grid" id="proposalTemplateGrid" aria-label="提案テンプレート"></div>

          <form id="proposalForm" class="proposal-form" novalidate>
            <div>
              <label for="pf-title">タイトル *</label>
              <input id="pf-title" name="title" type="text" required maxlength="160" placeholder="例: 新しいFFAキットの追加">
            </div>

            <div>
              <label for="pf-description">説明 *</label>
              <textarea id="pf-description" name="description" required maxlength="3000" placeholder="提案の内容を具体的に書いてください。"></textarea>
              <p class="hint">具体的に書くほど採用されやすくなります。</p>
            </div>

            <div class="form-row">
              <div>
                <label for="pf-type">提案の種類 *</label>
                <select id="pf-type" name="type" required>
                  <option value="feature">機能提案</option>
                  <option value="bug">バグ報告</option>
                  <option value="quest">クエスト提案</option>
                  <option value="other">その他</option>
                </select>
              </div>
              <div>
                <label for="pf-priority">優先度</label>
                <select id="pf-priority" name="priority">
                  <option value="low">低</option>
                  <option value="medium" selected>中</option>
                  <option value="high">高</option>
                  <option value="critical">緊急</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div>
                <label for="pf-author">提案者名</label>
                <input id="pf-author" name="author" type="text" maxlength="60" placeholder="あなたの名前（省略可）">
              </div>
              <div>
                <label for="pf-tags">タグ（任意）</label>
                <input id="pf-tags" name="tags" type="text" placeholder="例: FFA, ショップ, UI">
                <p class="hint">カンマ区切りで入力してください。</p>
              </div>
            </div>

            <div>
              <label for="pf-notes">備考（任意）</label>
              <textarea id="pf-notes" name="notes" maxlength="1000" rows="2" placeholder="補足があれば入力してください。"></textarea>
            </div>

            <div class="proposal-form-actions">
              <button type="submit" class="btn primary">提案を作成する</button>
              <a class="btn" href="./">キャンセル</a>
            </div>
          </form>

          <div class="form-message" id="formMessage" hidden></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="shell footer-grid">
      <div>
        <img src="../assets/mct-wordmark-transparent.png" alt="MCT">
        <p class="legal">© 2026 MCT. All rights reserved.</p>
      </div>
      <div class="footer-links">
        <a href="../">Mifron</a>
        <a href="../quests/">クエスト</a>
        <a href="./">提案</a>
        <a href="../tutorial.html">チュートリアル</a>
      </div>
    </div>
  </footer>
</body>
</html>
