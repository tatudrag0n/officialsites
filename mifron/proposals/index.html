<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fafaf7">
  <title>提案 | Mifron</title>
  <meta name="description" content="Mifronの改善提案・バグ報告・クエスト提案の一覧。状態と内容を確認できます。">
  <link rel="canonical" href="https://mifron.mct-official.com/proposals/">
  <link rel="icon" href="../assets/mifron-favicon.png">
  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="stylesheet" href="../assets/proposals.css">
  <script src="../assets/config.js" defer></script>
  <script src="../assets/site.js" defer></script>
  <script src="../assets/proposals.js" defer></script>
</head>
<body class="proposal-page">
  <a class="skip" href="#main">本文へ移動</a>
  <header class="site-header">
    <div class="shell nav">
      <a class="brand" href="../">
        <img class="brand-icon" src="../assets/mifron-icon.webp" alt="Mifron">
        <span class="brand-text">Mifron</span>
      </a>
      <nav class="nav-links" id="nav-panel" aria-label="サイト内ナビゲーション">
        <a href="../">ホーム</a>
        <a href="../tutorial.html">チュートリアル</a>
        <a href="../quests/">クエスト</a>
        <a href="./" aria-current="page">提案</a>
        <a class="hot" data-discord href="#">Discord</a>
      </nav>
      <button class="menu" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="nav-panel"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main id="main">
    <section class="hero">
      <div class="shell">
        <p class="kicker">Proposals</p>
        <h1>提案</h1>
        <p class="lead">機能提案・バグ報告・クエスト提案を受け付けています。審査後に実装が決まると、状態が変わります。</p>
        <div class="hero-actions">
          <a class="btn primary" href="./create.html">提案する</a>
          <a class="btn" href="../quests/propose.html">クエストを提案</a>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="shell">
        <div class="section-head">
          <div>
            <p class="eyebrow">一覧</p>
            <h2>現在の提案</h2>
          </div>
          <p>カードをタップすると、内容・優先度・状態を確認できます。</p>
        </div>

        <div class="filter-bar proposal-filters" role="group" aria-label="状態で絞り込み">
          <button class="filter-btn active" data-filter="all" type="button">すべて</button>
          <button class="filter-btn" data-filter="open" type="button">審査中</button>
          <button class="filter-btn" data-filter="in_progress" type="button">実装中</button>
          <button class="filter-btn" data-filter="completed" type="button">完了</button>
          <button class="filter-btn" data-filter="rejected" type="button">却下</button>
        </div>

        <div class="proposal-grid" id="proposalGrid">
          <p class="detail-meta">読み込み中…</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="shell footer-grid">
      <div class="footer-brand">
        <img src="../assets/mct-wordmark-transparent.png" alt="MCT">
        <p class="legal">© 2026 MCT. All rights reserved.</p>
      </div>
      <nav class="footer-links" aria-label="フッター">
        <a href="../">Mifron</a>
        <a href="../quests/">クエスト</a>
        <a href="./create.html">提案する</a>
        <a href="../tutorial.html">チュートリアル</a>
      </nav>
    </div>
  </footer>
</body>
</html>
